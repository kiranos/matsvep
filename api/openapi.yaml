  "/onboarding/answers":
    get:
      operationId: getOnboardingAnswers
      summary: "Get saved household onboarding answers"
      tags:
        - Onboarding
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OnboardingAnswers"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/onboarding/answers/{question_id}":
    put:
      operationId: saveOnboardingAnswer
      summary: "Save or replace an onboarding answer"
      tags:
        - Onboarding
      parameters:
        -
          "$ref": "#/components/parameters/QuestionId"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/OnboardingAnswerRequest"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OnboardingAnswer"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/onboarding/complete":
    post:
      operationId: completeOnboarding
      summary: "Apply starting ratings and affinity seeds"
      tags:
        - Onboarding
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/plans":
    get:
      operationId: listPlans
      summary: "List household plans by local week"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/Cursor"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlanPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    post:
      operationId: preparePlan
      summary: "Prepare a week or split-week plan"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PlanCreateRequest"
      responses:
        "201":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Plan"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/plans/{plan_id}":
    get:
      operationId: getPlan
      summary: "Get a plan with its current version and slots"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/PlanId"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Plan"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/plans/{plan_id}/deck":
    get:
      operationId: getDeck
      summary: "Get ranked cards for one local plan date"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/PlanId"
        -
          "$ref": "#/components/parameters/LocalDate"
        -
          "$ref": "#/components/parameters/Cursor"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeckPage"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/plans/{plan_id}/slots/{slot_id}/choose":
    post:
      operationId: choosePlanSlot
      summary: "Choose a recipe and optionally record a pick swipe atomically"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/PlanId"
        -
          "$ref": "#/components/parameters/SlotId"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChooseRequest"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlanChangeResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/plans/{plan_id}/slots/{slot_id}/replace":
    post:
      operationId: replacePlanSlot
      summary: "Replace a chosen dinner"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/PlanId"
        -
          "$ref": "#/components/parameters/SlotId"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChooseRequest"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PlanChangeResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/plans/{plan_id}/autofill":
    post:
      operationId: autofillPlan
      summary: "Choose top cards for all remaining open days"
      tags:
        - Plans
      parameters:
        -
          "$ref": "#/components/parameters/PlanId"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ExpectedPlanVersion"
      responses:
        "200":
          description: "Request succeeded"
          content:
