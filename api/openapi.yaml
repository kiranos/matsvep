openapi: 3.0.3
info:
  title: Matsvep API
  version: 0.2.0
  description: Household, planning and recipe contract. Operations return English codes with parameters, never display text; recipe content is data.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Household
  - name: Settings
  - name: Onboarding
  - name: Plans
  - name: Recipes
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check API health
      security: []
      responses:
        '200':
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [Recipes]
      summary: Get a recipe and its source attribution
      description: Steps are omitted when the primary source uses index_only display mode.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Recipe found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /recipes/search:
    get:
      operationId: searchRecipes
      tags: [Recipes]
      summary: Search the local recipe catalogue
      description: Returns active, non-blocked recipes matching title or ingredient text, with this household's rating and wishlist flag. Search uses cursor pagination.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: source_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  "/auth/register":
    post:
      operationId: registerMember
      summary: "Create a household or join with a one-time invite"
      tags:
        - Auth
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthTokens"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "429":
          "$ref": "#/components/responses/RateLimited"
      security: []
  "/auth/token":
    post:
      operationId: createAppToken
      summary: "Issue app tokens for an admin or member"
      tags:
        - Auth
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthTokens"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "429":
          "$ref": "#/components/responses/RateLimited"
      security: []
  "/auth/refresh":
    post:
      operationId: refreshAppToken
      summary: "Rotate a device refresh token"
      tags:
        - Auth
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuthTokens"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "429":
          "$ref": "#/components/responses/RateLimited"
      security: []
  "/auth/revoke":
    post:
      operationId: revokeAppToken
      summary: "Revoke the current device refresh token"
      tags:
        - Auth
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/EventResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/auth/logout":
    post:
      operationId: logoutAppDevice
      summary: Revoke the authenticated app device
      tags: [Auth]
      responses:
        '200':
          description: Device logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  "/household":
    get:
      operationId: getHousehold
      summary: "Get the member household"
      tags:
        - Household
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Household"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    patch:
      operationId: updateHousehold
      summary: "Update household name, size or time zone"
      tags:
        - Household
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/HouseholdPatch"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Household"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/household/invites":
    post:
      operationId: createHouseholdInvite
      summary: "Create a single-use expiring invite"
      tags:
        - Household
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/InviteCreateRequest"
      responses:
        "201":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/InviteResult"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "429":
          "$ref": "#/components/responses/RateLimited"
  "/household/settings":
    get:
      operationId: getHouseholdSettings
      summary: "Get effective household settings"
      tags:
        - Settings
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HouseholdSettings"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    patch:
      operationId: updateHouseholdSettings
      summary: "Update household settings"
      tags:
        - Settings
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/HouseholdSettingsPatch"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/HouseholdSettings"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/household/day-profiles":
    get:
      operationId: getDayProfiles
      summary: "Get effective Sunday-to-Saturday day profiles"
      tags:
        - Settings
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DayProfileList"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    put:
      operationId: setDayProfiles
      summary: "Replace the household day-profile overrides"
      tags:
        - Settings
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DayProfileList"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DayProfileList"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/devices/current":
    patch:
      operationId: updateCurrentDevice
      summary: "Update the current app device push token"
      tags:
        - Auth
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DevicePatch"
      responses:
        "200":
          description: "Request succeeded"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Device"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/onboarding/questions":
    get:
      operationId: listOnboardingQuestions
      summary: "List onboarding question codes and data options"
      tags:
